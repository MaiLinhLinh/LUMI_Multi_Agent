<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1040" viewBox="0 0 1800 1040">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#183b63"/>
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#087d62"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #10233f; }
      .subtitle { font: 500 17px Arial, sans-serif; fill: #536b89; }
      .lane { font: 700 17px Arial, sans-serif; fill: #4b6282; letter-spacing: 1px; }
      .boxTitle { font: 700 23px Arial, sans-serif; fill: #112742; text-anchor: middle; }
      .boxText { font: 500 16px Arial, sans-serif; fill: #344d6c; text-anchor: middle; }
      .small { font: 500 14px Arial, sans-serif; fill: #4b6282; text-anchor: middle; }
      .label { font: 600 14px Arial, sans-serif; fill: #365778; text-anchor: middle; }
      .progress { font: 700 15px Arial, sans-serif; fill: #087d62; text-anchor: middle; }
      .note { font: 500 14px Arial, sans-serif; fill: #536b89; }
    </style>
  </defs>

  <rect width="1800" height="1040" fill="#f8fbff"/>
  <text x="80" y="65" class="title">Lumi Framework — luồng hội thoại, lập kế hoạch và báo tiến độ</text>
  <text x="80" y="95" class="subtitle">Domain chỉ sở hữu prompt; asset, template và extension là tài nguyên dùng chung của framework.</text>

  <!-- Lanes -->
  <text x="80" y="145" class="lane">TRẢI NGHIỆM NGƯỜI DÙNG</text>
  <line x1="80" y1="158" x2="1720" y2="158" stroke="#d8e5f3" stroke-width="2"/>
  <text x="80" y="285" class="lane">LIVE + RUNTIME</text>
  <line x1="80" y1="298" x2="1720" y2="298" stroke="#d8e5f3" stroke-width="2"/>
  <text x="80" y="755" class="lane">TIẾN ĐỘ PLAN AGENT — EVENT-DRIVEN</text>
  <line x1="80" y1="768" x2="1720" y2="768" stroke="#d8e5f3" stroke-width="2"/>
  <text x="80" y="900" class="lane">REGISTRY DÙNG CHUNG</text>

  <!-- User and browser -->
  <rect x="80" y="185" width="220" height="125" rx="20" fill="#fff6d9" stroke="#e2ab18" stroke-width="2"/>
  <text x="190" y="230" class="boxTitle">Người dùng</text>
  <text x="190" y="260" class="boxText">giọng nói / text</text>
  <text x="190" y="285" class="boxText">chạm panel</text>

  <rect x="390" y="185" width="250" height="125" rx="20" fill="#e8f3ff" stroke="#4d94d6" stroke-width="2"/>
  <text x="515" y="230" class="boxTitle">Browser</text>
  <text x="515" y="260" class="boxText">mic · WebSocket</text>
  <text x="515" y="285" class="boxText">render · interaction</text>

  <rect x="760" y="185" width="300" height="125" rx="20" fill="#fdeafa" stroke="#e251a7" stroke-width="2"/>
  <text x="910" y="230" class="boxTitle">Gemini Live</text>
  <text x="910" y="260" class="boxText">đối thoại thời gian thực</text>
  <text x="910" y="285" class="boxText">route_request · visual tool</text>

  <rect x="1430" y="185" width="290" height="125" rx="20" fill="#fff0e4" stroke="#e58b4d" stroke-width="2"/>
  <text x="1575" y="230" class="boxTitle">Browser renderer</text>
  <text x="1575" y="260" class="boxText">SurfaceDocument → DOM</text>
  <text x="1575" y="285" class="boxText">CSS · animation · event</text>

  <!-- Runtime -->
  <rect x="250" y="390" width="290" height="150" rx="20" fill="#fff5d4" stroke="#e2a700" stroke-width="2"/>
  <text x="395" y="435" class="boxTitle">Live Orchestrator</text>
  <text x="395" y="465" class="boxText">nhận route_request</text>
  <text x="395" y="490" class="boxText">quản lý run, panel, revision</text>
  <text x="395" y="515" class="boxText">đưa SurfaceReady về Gemini</text>

  <rect x="670" y="390" width="300" height="150" rx="20" fill="#e9edff" stroke="#7066d8" stroke-width="2"/>
  <text x="820" y="435" class="boxTitle">Plan Agent</text>
  <text x="820" y="465" class="boxText">đọc domain prompt + catalog</text>
  <text x="820" y="490" class="boxText">gọi search / describe / capability</text>
  <text x="820" y="515" class="boxText">final Surface Plan</text>

  <rect x="1100" y="390" width="250" height="150" rx="20" fill="#e6f7f2" stroke="#2d9e7c" stroke-width="2"/>
  <text x="1225" y="435" class="boxTitle">Compiler</text>
  <text x="1225" y="465" class="boxText">validate widget + asset</text>
  <text x="1225" y="490" class="boxText">materialize template</text>
  <text x="1225" y="515" class="boxText">SurfaceDocument</text>

  <!-- Main arrows: deliberately separated into dedicated rows -->
  <line x1="300" y1="247" x2="390" y2="247" stroke="#183b63" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="345" y="230" class="label">audio / text / event</text>
  <line x1="640" y1="247" x2="760" y2="247" stroke="#183b63" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="700" y="230" class="label">WebSocket stream</text>
  <path d="M 910 310 L 910 350 L 395 350 L 395 390" fill="none" stroke="#183b63" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="650" y="340" class="label">route_request</text>
  <line x1="540" y1="465" x2="670" y2="465" stroke="#183b63" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="605" y="447" class="label">AgentRun: domain_id + intent</text>
  <line x1="970" y1="465" x2="1100" y2="465" stroke="#183b63" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1035" y="447" class="label">final Surface Plan</text>
  <path d="M 1350 465 L 1390 465 L 1390 247 L 1430 247" fill="none" stroke="#183b63" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1390" y="445" class="label">SurfaceDocument</text>
  <path d="M 540 390 L 540 365 L 1060 365 L 1060 310" fill="none" stroke="#183b63" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  <text x="800" y="385" class="label">SURFACE_READY sau browser render và sau Gemini speech complete</text>

  <!-- Progress section -->
  <rect x="430" y="800" width="280" height="100" rx="18" fill="#edf8f4" stroke="#35aa87" stroke-width="2"/>
  <text x="570" y="840" class="boxTitle">Tool executor</text>
  <text x="570" y="870" class="boxText">search / describe trả result</text>

  <rect x="790" y="800" width="280" height="100" rx="18" fill="#effaf6" stroke="#35aa87" stroke-width="2"/>
  <text x="930" y="840" class="boxTitle">ProgressReporter</text>
  <text x="930" y="870" class="boxText">đổi result thành câu trung lập</text>

  <rect x="1150" y="800" width="300" height="100" rx="18" fill="#edf8f4" stroke="#35aa87" stroke-width="2"/>
  <text x="1300" y="840" class="boxTitle">GeminiSession FIFO</text>
  <text x="1300" y="870" class="boxText">gửi ngay hoặc đợi speech complete</text>

  <path d="M 820 540 L 820 720 L 570 720 L 570 800" fill="none" stroke="#087d62" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#greenArrow)"/>
  <text x="695" y="710" class="progress">tool result thành công</text>
  <line x1="710" y1="850" x2="790" y2="850" stroke="#087d62" stroke-width="3" marker-end="url(#greenArrow)"/>
  <text x="750" y="830" class="progress">ToolResultAvailable</text>
  <line x1="1070" y1="850" x2="1150" y2="850" stroke="#087d62" stroke-width="3" marker-end="url(#greenArrow)"/>
  <text x="1110" y="830" class="progress">PlanProgress</text>
  <path d="M 1300 800 L 1300 730 L 1650 730 L 1650 340 L 1060 340 L 1060 285" fill="none" stroke="#087d62" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#greenArrow)"/>
  <text x="1380" y="715" class="progress">PLAN_PROGRESS → Gemini chọn có nói hay không</text>

  <!-- Shared registry strip -->
  <rect x="80" y="930" width="480" height="75" rx="16" fill="#eef8e8" stroke="#72a853" stroke-width="2"/>
  <text x="320" y="960" class="boxTitle">Domain package</text>
  <text x="320" y="985" class="boxText">manifest + presentation prompt + plan prompt</text>
  <rect x="660" y="930" width="480" height="75" rx="16" fill="#eef8e8" stroke="#72a853" stroke-width="2"/>
  <text x="900" y="960" class="boxTitle">SharedResourceRegistry</text>
  <text x="900" y="985" class="boxText">asset catalog + template catalog — mọi domain cùng dùng</text>
  <rect x="1240" y="930" width="480" height="75" rx="16" fill="#eef8e8" stroke="#72a853" stroke-width="2"/>
  <text x="1480" y="960" class="boxTitle">ExtensionLoader</text>
  <text x="1480" y="985" class="boxText">widget / effect registry + browser modules</text>
</svg>
